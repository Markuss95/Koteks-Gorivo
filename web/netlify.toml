# Netlify config for the frontend (web workspace).
# In the Netlify dashboard set the build env var:
#   VITE_API_BASE_URL = https://<your-render-service>.onrender.com
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# SPA fallback so deep links resolve to the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
