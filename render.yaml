# Render Blueprint — backend API + scheduled LiDAT sync.
# Deploy: Render Dashboard → New → Blueprint → select this repo.
# Secrets (sync:false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: koteks-gorivo-api
    runtime: node
    region: frankfurt        # EU region — closest to the Croatian Maris server & LiDAT
    plan: starter            # always-on (no spin-down) so the 6-hourly sync keeps running
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api
    autoDeploy: true

    # Persistent disk so the accumulated LiDAT history survives deploys/restarts.
    disk:
      name: data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: DB_PATH
        value: /data/koteks-gorivo.db

      # Non-secret defaults
      - key: MARIS_BASE_URL
        value: https://portal.osijek-koteks.hr
      - key: LIDAT_BASE_URL
        value: https://www.lidatexternal.liebherr.com/LidatExternal/Service.svc
      - key: LIDAT_SYNC_CRON
        value: "0 */6 * * *"
      - key: LIDAT_SYNC_ON_START
        value: "true"
      - key: FUEL_ARTICLE_CODES
        value: "06010001"
      - key: DATA_MIN_DATE
        value: "2026-05-27"

      # Secrets — set these in the Render dashboard (Environment tab)
      - key: MARIS_CLIENT_ID
        sync: false
      - key: MARIS_CLIENT_SECRET
        sync: false
      - key: LIDAT_USERNAME
        sync: false
      - key: LIDAT_PASSWORD
        sync: false
      # Second AEMP login (Velika fleet). Add in the Render dashboard.
      - key: LIDAT_USERNAME_2
        sync: false
      - key: LIDAT_PASSWORD_2
        sync: false
      # Third AEMP login (Kamen Okučani → Kamen Psunj fleet). Add in the dashboard.
      - key: LIDAT_USERNAME_3
        sync: false
      - key: LIDAT_PASSWORD_3
        sync: false
      # Set to your Netlify site URL once known, e.g. https://koteks-gorivo.netlify.app
      - key: CORS_ORIGIN
        sync: false

      # ---- E-mail (Microsoft Graph) + automatic monthly reports ----
      # Tenant and client IDs are public identifiers (they appear in OAuth URLs),
      # so they live here; only the client secret is entered in the dashboard.
      - key: GRAPH_TENANT_ID
        value: 447dfde3-8b10-4752-9a23-7a947fa4c21e
      - key: GRAPH_CLIENT_ID
        value: c68c0d3b-a5b0-46b1-86d1-3848505de459
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: MAIL_FROM
        value: noreply@osijek-koteks.hr
      - key: MAIL_TO
        value: marko.krajina@osijek-koteks.hr
      - key: MAIL_SAVE_TO_SENT
        value: "true"
      - key: MAIL_ALLOWED_DOMAINS
        value: "osijek-koteks.hr,velicki-kamen.hr,kamen-psunj.hr,abgtest.hr,molaris.hr,prodorina.hr,r-promet.hr"
      # Daily check; only the last working day of the month actually sends.
      - key: REPORT_CRON
        value: "0 6 * * *"
      - key: REPORT_SCHEDULE_ENABLED
        value: "true"

      # Auth — secret for signing login tokens (long random string) and the first
      # admin, created on first boot when no users exist yet.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
